<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Platform Launchpad system architecture</title>
  <desc id="desc">A developer uses a Next.js portal backed by FastAPI, PostgreSQL, Redis, and a Python worker. The delivery path connects Jenkins, Amazon ECR, Terraform, GitOps, Argo CD, and Amazon EKS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071520"/>
      <stop offset="1" stop-color="#0d2430"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".25"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4be1bd"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="60" y="70" fill="#f2faf8" font-family="Arial, sans-serif" font-size="32" font-weight="700">Platform Launchpad</text>
  <text x="60" y="104" fill="#91a9b7" font-family="Arial, sans-serif" font-size="17">Developer self-service application and controlled delivery path</text>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="55" y="190" width="175" height="105" rx="16" fill="#102a36" stroke="#4be1bd"/>
    <text x="142" y="232" text-anchor="middle" fill="#4be1bd" font-size="19" font-weight="700">Developer</text>
    <text x="142" y="262" text-anchor="middle" fill="#b6c7cf" font-size="14">Requests and status</text>

    <rect x="295" y="165" width="205" height="155" rx="16" fill="#102a36" stroke="#4be1bd"/>
    <text x="397" y="215" text-anchor="middle" fill="#f2faf8" font-size="20" font-weight="700">Next.js Portal</text>
    <text x="397" y="246" text-anchor="middle" fill="#b6c7cf" font-size="14">Developer experience</text>
    <text x="397" y="274" text-anchor="middle" fill="#b6c7cf" font-size="14">Environment actions</text>

    <rect x="565" y="165" width="205" height="155" rx="16" fill="#102a36" stroke="#4be1bd"/>
    <text x="667" y="215" text-anchor="middle" fill="#f2faf8" font-size="20" font-weight="700">FastAPI</text>
    <text x="667" y="246" text-anchor="middle" fill="#b6c7cf" font-size="14">Auth and validation</text>
    <text x="667" y="274" text-anchor="middle" fill="#b6c7cf" font-size="14">Lifecycle API</text>

    <rect x="835" y="145" width="150" height="110" rx="16" fill="#102a36" stroke="#4be1bd"/>
    <text x="910" y="190" text-anchor="middle" fill="#f2faf8" font-size="18" font-weight="700">PostgreSQL</text>
    <text x="910" y="218" text-anchor="middle" fill="#b6c7cf" font-size="13">Durable state</text>

    <rect x="835" y="275" width="150" height="110" rx="16" fill="#102a36" stroke="#4be1bd"/>
    <text x="910" y="320" text-anchor="middle" fill="#f2faf8" font-size="18" font-weight="700">Redis</text>
    <text x="910" y="348" text-anchor="middle" fill="#b6c7cf" font-size="13">Queue and cache</text>

    <rect x="1015" y="275" width="145" height="110" rx="16" fill="#102a36" stroke="#4be1bd"/>
    <text x="1087" y="320" text-anchor="middle" fill="#f2faf8" font-size="18" font-weight="700">Python Worker</text>
    <text x="1087" y="348" text-anchor="middle" fill="#b6c7cf" font-size="13">Async operations</text>
  </g>

  <g fill="none" stroke="#4be1bd" stroke-width="3" marker-end="url(#arrow)">
    <path d="M230 242 H290"/>
    <path d="M500 242 H560"/>
    <path d="M770 215 H830"/>
    <path d="M770 275 C800 275 800 330 830 330"/>
    <path d="M985 330 H1010"/>
  </g>

  <rect x="55" y="455" width="1090" height="190" rx="20" fill="#091c26" stroke="#2b4a58"/>
  <text x="85" y="500" fill="#4be1bd" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">CONTROLLED DELIVERY DIRECTION</text>
  <g font-family="Arial, sans-serif">
    <g fill="#102a36" stroke="#2b4a58">
      <rect x="85" y="535" width="135" height="70" rx="12"/>
      <rect x="260" y="535" width="135" height="70" rx="12"/>
      <rect x="435" y="535" width="135" height="70" rx="12"/>
      <rect x="610" y="535" width="135" height="70" rx="12"/>
      <rect x="785" y="535" width="135" height="70" rx="12"/>
      <rect x="960" y="535" width="150" height="70" rx="12"/>
    </g>
    <g fill="#f2faf8" font-size="17" font-weight="700" text-anchor="middle">
      <text x="152" y="578">Jenkins</text>
      <text x="327" y="578">Amazon ECR</text>
      <text x="502" y="578">Terraform</text>
      <text x="677" y="578">GitOps</text>
      <text x="852" y="578">Argo CD</text>
      <text x="1035" y="578">Amazon EKS</text>
    </g>
  </g>
  <g fill="none" stroke="#4be1bd" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M220 570 H255"/><path d="M395 570 H430"/><path d="M570 570 H605"/><path d="M745 570 H780"/><path d="M920 570 H955"/>
  </g>
  <text x="60" y="685" fill="#78909c" font-family="Arial, sans-serif" font-size="14">Current application foundation is being expanded incrementally toward governed environment self-service.</text>
</svg>
